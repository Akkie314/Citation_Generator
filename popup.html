<!DOCTYPE html>
<html lang="jp">

<head>
    <meta charset="utf-8">
    <title>出典情報ジェネレータ</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <main>
        <h1>出典情報ジェネレータ</h1>
        <div class="date-box">
            <label>
                <div class="date-key">
                    出典情報
                </div>
                <input type="text" value="https://google.com/" id="citation_text" class="date-value" readonly>
                <button class="copy-btn btn">Copy</button>
            </label>
        </div>
        <hr>
        <h3>取得情報</h3>
        <div class="date-box">
            <label>
                <div class="date-key">
                    タイトル
                </div>
                <input type="text" value="取得できませんでした" id="title" class="date-value">
                <button class="copy-btn btn">Copy</button>
            </label>
        </div>
        <div class="date-box">
            <label>
                <div class="date-key">
                    URL
                </div>
                <input type="text" value="取得できませんでした" id="url" class="date-value">
                <button class="copy-btn btn">Copy</button>
            </label>
        </div>
        <div class="date-box">
            <label>
                <div class="date-key">
                    閲覧日
                </div>
                <input type="text" value="取得できませんでした" id="citation_date" class="date-value">
                <button class="copy-btn btn">Copy</button>
            </label>
        </div>
        <div class="date-box">
            <label>
                <div class="date-key">
                    サイト名
                </div>
                <input type="text" value="取得できませんでした" id="site_name" class="date-value">
                <button class="copy-btn btn">Copy</button>
            </label>
        </div>
        <hr>
        <h3>オプション</h3>
        <div class="date-box">
            <label>
                <div class="date-key">
                    形式
                </div>
                <input type="text" value="取得できませんでした" id="citation_format" class="date-value">
                <button class="reset-btn btn">Reset</button>
            </label>
            <p style="color:#808080">
                プレースホルダー: {site_name}, {title}, {url}, {now_date}
            </p>
        </div>

        <a href="https://google.com/" target="_blank" rel="nofollow noreferrer">
            <img src="./icons/new_tab.svg" class="text-icon"/>
            フィードバック・機能要望
        </a>
    </main>

    <div class="tips"></div>


    <script src="popup.js"></script>
</body>

</html>
